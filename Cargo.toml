[package]
name = "tonapi-x"
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "SDK for integrating TonAPI into Rust apps. Forked from https://github.com/liketurbo/tonapi-rs"
repository = "https://github.com/vloldik/tonapi-rs"
readme = "README.md"
categories = ["cryptography::cryptocurrencies", "web-programming::http-client"]
keywords = ["blockchain", "ton", "tonapi"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
reqwest = { version = "^0.11", features = ["json", "multipart"] }
reqwest-eventsource = "^0.5"
futures = "^0.3"
async-recursion = "^1.0"
tokio = "^1.34"
tokio-tungstenite = { version = "^0.20", features = ["native-tls"] }
futures-util = "^0.3"
log = "^0.4"
url = "^2.5"
anyhow = "^1.0"

[dev-dependencies]
tokio = { version = "^1.34", features = ["full"] }
simple_logger = "^4.3"